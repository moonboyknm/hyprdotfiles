general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = ! test -f /tmp/hypridle_inhibit_active && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600
    on-timeout = ! test -f /tmp/hypridle_inhibit_active && $general.lock_cmd
}

listener {
    timeout = 900
    on-timeout = ! test -f /tmp/hypridle_inhibit_active && loginctl suspend
}
